name: Build Flutter iOS IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: FLUTTER
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: FLUTTER
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: FLUTTER
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r SmartHome.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-iOS-${{ github.run_number }}
          path: FLUTTER/SmartHome.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: "Smart Home iOS IPA #${{ github.run_number }}"
          body: |
            **Auto build iOS từ commit:** ${{ github.sha }}

            ### Cài đặt (không cần jailbreak)
            1. Download `SmartHome.ipa`
            2. Dùng **AltStore** hoặc **Sideloadly** để cài lên iPhone/iPad
            3. AltStore: [altstore.io](https://altstore.io) — miễn phí, cần PC mỗi 7 ngày re-sign
            4. Sideloadly: [sideloadly.io](https://sideloadly.io) — cắm cáp, cài 1 click

            > IPA này **không có codesign** — phải dùng AltStore/Sideloadly để sign bằng Apple ID cá nhân

            ${{ github.event.head_commit.message }}
          files: FLUTTER/SmartHome.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

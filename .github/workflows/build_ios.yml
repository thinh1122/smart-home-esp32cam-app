name: Build iOS IPA (No-Codesign)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 3. Flutter pub get
      - name: Flutter pub get
        working-directory: FLUTTER
        run: flutter pub get

      # 4. Debug: find Flutter tool location and the exact file with signing check
      - name: Debug Flutter location
        run: |
          which flutter
          flutter --version
          FLUTTER_HOME=$(flutter --version --machine 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('flutterRoot',''))" 2>/dev/null || dirname $(dirname $(which flutter)))
          echo "Flutter home: $FLUTTER_HOME"
          find "$FLUTTER_HOME" -name "*.dart" 2>/dev/null | xargs grep -l "requires a selected Development Team" 2>/dev/null || echo "NOT FOUND in dart files"
          find "$FLUTTER_HOME" -name "*.snapshot" 2>/dev/null | head -5
          ls "$FLUTTER_HOME/packages/flutter_tools/lib/src/ios/" 2>/dev/null || echo "ios dir not found"

      # 5. Build iOS (no codesign)
      - name: Build iOS (no-codesign)
        working-directory: FLUTTER
        run: |
          flutter build ios --release --no-codesign
          echo "Build done"

      # 5. Tạo Payload folder và đóng gói .ipa
      - name: Package IPA
        working-directory: FLUTTER
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r SmartHome.ipa Payload
          echo "IPA created"

      # 6. Upload artifact (tải về từ GitHub Actions)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-iOS
          path: FLUTTER/build/ios/iphoneos/SmartHome.ipa
          retention-days: 7

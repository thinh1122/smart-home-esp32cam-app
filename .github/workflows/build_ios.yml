name: Build iOS IPA (No-Codesign)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 3. Flutter pub get
      - name: Flutter pub get
        working-directory: FLUTTER
        run: flutter pub get

      # 4. Patch Flutter tool to skip Development Team check
      - name: Patch Flutter signing check
        run: |
          FLUTTER_TOOL=$(dirname $(which flutter))/../packages/flutter_tools/lib/src/ios/xcode_backend.dart
          if [ -f "$FLUTTER_TOOL" ]; then
            sed -i '' 's/throwToolExit.*Development Team.*$/\/\/ patched/g' "$FLUTTER_TOOL" || true
          fi
          # Find and patch the actual check file
          FLUTTER_HOME=$(dirname $(dirname $(which flutter)))
          find "$FLUTTER_HOME" -name "*.dart" -path "*/flutter_tools/*" | xargs grep -l "requires a selected Development Team" 2>/dev/null | while read f; do
            echo "Patching $f"
            sed -i '' 's/throwToolExit.*requires a selected Development Team.*$/\/\/ patched: skip signing check/g' "$f" || true
            sed -i '' '/requires a selected Development Team/d' "$f" || true
          done

      # 5. Build iOS (no codesign)
      - name: Build iOS (no-codesign)
        working-directory: FLUTTER
        run: |
          flutter build ios --release --no-codesign
          echo "Build done"

      # 5. Tạo Payload folder và đóng gói .ipa
      - name: Package IPA
        working-directory: FLUTTER
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r SmartHome.ipa Payload
          echo "IPA created"

      # 6. Upload artifact (tải về từ GitHub Actions)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-iOS
          path: FLUTTER/build/ios/iphoneos/SmartHome.ipa
          retention-days: 7

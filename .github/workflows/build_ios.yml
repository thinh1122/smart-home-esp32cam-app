name: Build iOS IPA (No-Codesign)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Switch to Xcode 15
      - name: Select Xcode 15
        run: |
          ls /Applications/ | grep Xcode
          XCODE15=$(ls /Applications/ | grep "Xcode_15" | head -1)
          if [ -n "$XCODE15" ]; then
            sudo xcode-select -s /Applications/$XCODE15/Contents/Developer
          else
            XCODE15=$(ls /Applications/ | grep "Xcode" | grep -v "16" | head -1)
            sudo xcode-select -s /Applications/$XCODE15/Contents/Developer
          fi
          xcodebuild -version

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 4. Flutter pub get
      - name: Flutter pub get
        working-directory: FLUTTER
        run: flutter pub get

      # 5. Build iOS (no codesign)
      - name: Build iOS (no-codesign)
        working-directory: FLUTTER
        run: |
          flutter build ios --release --no-codesign
          echo "Build done"

      # 6. Tạo Payload folder và đóng gói .ipa
      - name: Package IPA
        working-directory: FLUTTER
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r SmartHome.ipa Payload
          echo "IPA created"

      # 7. Upload artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-iOS
          path: FLUTTER/build/ios/iphoneos/SmartHome.ipa
          retention-days: 7

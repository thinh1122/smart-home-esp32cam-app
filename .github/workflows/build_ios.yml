name: Build iOS IPA (No-Codesign)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: FLUTTER
        run: flutter pub get

      - name: Flutter gen files
        working-directory: FLUTTER
        run: flutter build ios --release --no-codesign --config-only || true

      - name: Pod install
        working-directory: FLUTTER/ios
        run: pod install --repo-update

      - name: Build iOS via xcodebuild (no-codesign)
        working-directory: FLUTTER/ios
        run: |
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build \
            build
          echo "Build done"

      - name: Package IPA
        working-directory: FLUTTER/ios
        run: |
          APP_PATH=$(find build -name "Runner.app" -not -path "*/Build/Intermediates*" | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SmartHome.ipa Payload
          echo "IPA created"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-iOS
          path: FLUTTER/ios/SmartHome.ipa
          retention-days: 7
